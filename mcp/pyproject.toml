[project]
name = "unlearnarc-mcp"
version = "0.1.0"
description = "MCP server — UnlearnArc admin tools (calls Java API, never the DB)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
unlearnarc-mcp = "unlearnarc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unlearnarc_mcp"]
