# Render Blueprint — backend only (frontends go to Vercel).
# Create via: Render Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: unlearnarc-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # pick the region closest to you / your Aiven region
    healthCheckPath: /api/v1/auth/health   # change if your health route differs
    autoDeploy: true
    envVars:
      # Render supplies PORT; Spring binds to it on 0.0.0.0.
      # ── Database (Aiven MySQL) — fill these in the dashboard, do NOT commit ──
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "10"
      # Create missing tables/columns from entity mappings on startup.
      # Data backfills and other SQL-only changes still require manual migrations.
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"
      - key: LOG_LEVEL_APP
        value: INFO
      # ── Secrets (rotate these before deploy) ────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── URLs (set after you know the Render + Vercel hostnames) ──────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH2_REDIRECT_URI
        sync: false
      - key: OAUTH2_FAILURE_REDIRECT_URI
        sync: false
