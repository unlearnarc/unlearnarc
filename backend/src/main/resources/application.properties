# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT}

# ─── DataSource ───────────────────────────────────────────────────────────────
# All values supplied via environment (.env locally, dashboard env vars in cloud).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Connection Pool ──────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.unlearnarc=${LOG_LEVEL_APP}
logging.level.org.springframework.web=INFO

# ─── JWT ──────────────────────────────────────────────────────────────────────
# 512-bit hex secret. MUST be supplied via env in every environment.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# ─── Admin Credentials ────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── Rate Limiting ────────────────────────────────────────────────────────────
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-tokens=10
app.rate-limit.login.refill-seconds=60
app.rate-limit.api.capacity=200
app.rate-limit.api.refill-tokens=200
app.rate-limit.api.refill-seconds=60

# ─── Google OAuth2 ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Must exactly match one of the Authorized Redirect URIs in Google Console.
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=UnlearnArc Google Login
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ─── OAuth2 Redirect URIs (frontend) ───────────────────────────────────────────
# After login, backend redirects to the frontend with the JWT in query params.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}
app.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI}

# ─── Contest Submission Rate Limit ──────────────────────────────────────────────
app.contest.submit-rate-limit.capacity=12
app.contest.submit-rate-limit.refill-tokens=12
app.contest.submit-rate-limit.refill-seconds=60

# ─── Leaderboard ──────────────────────────────────────────────────────────────
app.leaderboard.recompute-cron=0 15 3 * * *

# Optional server-only AI authoring. Existing features work without a key.
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
