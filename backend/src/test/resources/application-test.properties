# ═══════════════════════════════════════════════════════════════════════════════
#  TEST PROFILE — DB-free integration testing
#
#  Activated by @ActiveProfiles("test") on ApiAutomationIT. Uses an in-memory H2
#  database running in MySQL-compatibility mode so Hibernate can honour the
#  MySQL-specific columnDefinition values (LONGTEXT, MEDIUMTEXT, CHAR(n)) used by
#  the entities. No external MySQL instance is required to run the suite.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── DataSource (in-memory H2, MySQL dialect emulation) ─────────────────────────
spring.datasource.url=jdbc:h2:mem:unlearnarc;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# create-drop builds a fresh schema from the entities for each test run and tears
# it down afterwards. H2's MySQL mode maps LONGTEXT/MEDIUMTEXT/CHAR cleanly.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.unlearnarc=INFO
logging.level.org.hibernate.SQL=WARN

# ─── JWT (test-only secret) ─────────────────────────────────────────────────────
app.jwt.secret=6f8f57715090da2632453988d9a1501b9d8e3c8e7b5e2e3a4c6d0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── Admin Credentials (config-based login, no DB row needed) ───────────────────
app.admin.email=unlearnarc@gmail.com
app.admin.password=Admin@123

# ─── Rate Limiting ────────────────────────────────────────────────────────────
app.rate-limit.login.capacity=100
app.rate-limit.login.refill-tokens=100
app.rate-limit.login.refill-seconds=60
app.rate-limit.api.capacity=1000
app.rate-limit.api.refill-tokens=1000
app.rate-limit.api.refill-seconds=60

# ─── Contest Submission Rate Limit ──────────────────────────────────────────────
app.contest.submit-rate-limit.capacity=100
app.contest.submit-rate-limit.refill-tokens=100
app.contest.submit-rate-limit.refill-seconds=60

# ─── Leaderboard ──────────────────────────────────────────────────────────────
app.leaderboard.recompute-cron=0 15 3 * * *

# ─── Google OAuth2 (dummy values so the client registration bean still wires) ───
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8085/oauth2/callback/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
app.oauth2.redirect-uri=http://localhost:3002/auth/callback
app.oauth2.failure-redirect-uri=http://localhost:3002/auth/error
