<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"><style>
:root{--ink:#17212b;--muted:#64748b;--line:#cbd5e1;--soft:#eef2f7;--blue:#2563eb;--tint:#dbeafe;--bg:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a7b4c5;--line:#475569;--soft:#202b36;--blue:#75a7ff;--tint:#1b4075;--bg:#151e28}}
text{font:15px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.small{font-size:12px;fill:var(--muted)}
.cell{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.active{fill:var(--tint);stroke:var(--blue);stroke-width:2.5}.line{fill:none;stroke:var(--line);stroke-width:2}.arrow{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="var(--blue)"/></marker></defs><g opacity="1"><rect x="100" y="111" width="40" height="38" rx="6" class="active"/><text x="120" y="131">1</text></g><g opacity="1"><rect x="148" y="111" width="40" height="38" rx="6" class="cell"/><text x="168" y="131">8</text></g><g opacity="1"><rect x="196" y="111" width="40" height="38" rx="6" class="cell"/><text x="216" y="131">6</text></g><g opacity="1"><rect x="244" y="111" width="40" height="38" rx="6" class="cell"/><text x="264" y="131">3</text></g><g opacity="1"><rect x="292" y="111" width="40" height="38" rx="6" class="active"/><text x="312" y="131">2</text></g><g opacity="1"><rect x="340" y="111" width="40" height="38" rx="6" class="cell"/><text x="360" y="131">7</text></g><text class="small" x="312" y="68">minimum</text><path d="M312 80V105" class="arrow"/><path d="M312 159Q312 194 168 159" class="arrow"/><text class="small" x="120" y="178">sorted</text></svg>
