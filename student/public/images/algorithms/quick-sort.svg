<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"><style>
:root{--ink:#17212b;--muted:#64748b;--line:#cbd5e1;--soft:#eef2f7;--blue:#2563eb;--tint:#dbeafe;--bg:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a7b4c5;--line:#475569;--soft:#202b36;--blue:#75a7ff;--tint:#1b4075;--bg:#151e28}}
text{font:15px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.small{font-size:12px;fill:var(--muted)}
.cell{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.active{fill:var(--tint);stroke:var(--blue);stroke-width:2.5}.line{fill:none;stroke:var(--line);stroke-width:2}.arrow{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="var(--blue)"/></marker></defs><g opacity="1"><rect x="76" y="106" width="40" height="38" rx="6" class="cell"/><text x="96" y="126">2</text></g><g opacity="1"><rect x="124" y="106" width="40" height="38" rx="6" class="cell"/><text x="144" y="126">1</text></g><g opacity="1"><rect x="172" y="106" width="40" height="38" rx="6" class="cell"/><text x="192" y="126">3</text></g><g opacity="1"><rect x="220" y="106" width="40" height="38" rx="6" class="active"/><text x="240" y="126">5</text></g><g opacity="1"><rect x="268" y="106" width="40" height="38" rx="6" class="cell"/><text x="288" y="126">9</text></g><g opacity="1"><rect x="316" y="106" width="40" height="38" rx="6" class="cell"/><text x="336" y="126">8</text></g><g opacity="1"><rect x="364" y="106" width="40" height="38" rx="6" class="cell"/><text x="384" y="126">7</text></g><text class="small" x="240" y="68">pivot</text><path d="M240 80V100" class="arrow"/><path d="M216 96V158M264 96V158" class="line" stroke-dasharray="4 4"/><text class="small" x="144" y="181">smaller</text><text class="small" x="336" y="181">larger</text></svg>
