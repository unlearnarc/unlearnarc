<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"><style>
:root{--ink:#17212b;--muted:#64748b;--line:#cbd5e1;--soft:#eef2f7;--blue:#2563eb;--tint:#dbeafe;--bg:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a7b4c5;--line:#475569;--soft:#202b36;--blue:#75a7ff;--tint:#1b4075;--bg:#151e28}}
text{font:15px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.small{font-size:12px;fill:var(--muted)}
.cell{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.active{fill:var(--tint);stroke:var(--blue);stroke-width:2.5}.line{fill:none;stroke:var(--line);stroke-width:2}.arrow{fill:none;stroke:var(--blue);stroke-width:2;marker-end:url(#arrow)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="var(--blue)"/></marker></defs><path d="M240 45L140 115" class="line"/><path d="M240 45L340 115" class="line"/><path d="M140 115L85 190" class="line"/><path d="M140 115L185 190" class="line"/><path d="M340 115L295 190" class="line"/><path d="M340 115L395 190" class="line"/><circle cx="240" cy="45" r="21" class="active"/><text x="240" y="46">1</text><circle cx="140" cy="115" r="21" class="active"/><text x="140" y="116">2</text><circle cx="340" cy="115" r="21" class="active"/><text x="340" y="116">3</text><circle cx="85" cy="190" r="21" class="cell"/><text x="85" y="191">4</text><circle cx="185" cy="190" r="21" class="cell"/><text x="185" y="191">5</text><circle cx="295" cy="190" r="21" class="cell"/><text x="295" y="191">6</text><circle cx="395" cy="190" r="21" class="cell"/><text x="395" y="191">7</text></svg>
